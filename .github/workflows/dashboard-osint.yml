name: Dashboard OSINT update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collectors
        run: |
          python collector.py
          python get_trends.py

      - name: Smoke check JSON outputs
        run: |
          python scripts/check_data.py

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_feed.json trending.json communes.json taxonomy.json || true
          git diff --cached --quiet || git commit -m "chore: update OSINT dashboard data"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/osint-update
          base: main
          title: "chore: update OSINT dashboard data"
          body: |
            Automatic update of the dashboard data from the collectors.
          delete-branch: true

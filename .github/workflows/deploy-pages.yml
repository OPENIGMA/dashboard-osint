name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Mise à jour presse locale", "Mise à jour réseaux sociaux"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader le dossier /site comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

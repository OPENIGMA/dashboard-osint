name: OSINT Data Collector

on:
  schedule:
    - cron: '0 */6 * * *' # Toutes les 6 heures (évite le blocage de Google)
  workflow_dispatch: # Permet de lancer manuellement en 1 clic
  push:
    paths:
      - 'collector.py'
      - 'communes.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lancer le script collector
        run: python collector.py

      - name: Sauvegarder et publier les nouvelles données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_feed.json
          
          # Vérifie s'il y a des modifications avant de commiter
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🤖 Auto-update OSINT feed data [skip ci]"
            git push origin HEAD
            echo "✅ Données mises à jour et poussées avec succès sur GitHub."
          else
            echo "⚠️ Aucune nouvelle donnée à pousser."
          fi

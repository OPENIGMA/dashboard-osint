name: OSINT Data Collector

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute automatiquement toutes les 6 heures
  workflow_dispatch: # Permet de le lancer manuellement en 1 clic
  push:
    paths:
      - 'collector.py'
      - 'communes.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lancer le script collector
        run: python collector.py

      - name: Sauvegarder et publier les nouvelles données (Méthode infaillible)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Récupérer l'état exact du dépôt distant
          git fetch origin
          
          # Réinitialiser l'historique local pour correspondre au distant, 
          # tout en gardant les modifications du fichier data_feed.json
          git reset --soft origin/main
          
          git add data_feed.json
          
          # Vérifier s'il y a vraiment des changements à pousser
          if git diff-index --quiet HEAD --; then
            echo "Aucune nouvelle donnee a pousser."
          else
            git commit -m "Auto-update OSINT feed data [skip ci]"
            git push origin HEAD:main
            echo "Donnees mises a jour et poussees avec succes."
          fi

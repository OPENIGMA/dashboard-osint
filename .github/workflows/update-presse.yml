name: Mise à jour presse locale

on:
  schedule:
    # Toutes les 2 heures
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-presse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pyyaml

      - name: Lancer l'agrégation presse
        run: python3 scripts/fetch_rss.py

      - name: Lancer la génération des liens manuels
        run: python3 scripts/build_manual_links.py

      - name: Copier les données vers le site
        run: |
          mkdir -p site/data/presse
          cp data/presse/latest.json site/data/presse/latest.json
          cp data/presse/_errors.json site/data/presse/_errors.json
          cp data/manual_links.json site/data/manual_links.json

      - name: Commit et push si changement
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/presse site/data/presse data/manual_links.json site/data/manual_links.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique presse locale"
          git push

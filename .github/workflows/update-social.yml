name: Mise à jour réseaux sociaux

on:
  schedule:
    # Toutes les 4 heures
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pyyaml

      - name: Lancer la recherche Reddit
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "veille-osint-script/1.0"
        run: python3 scripts/fetch_reddit.py

      - name: Lancer la recherche Mastodon
        env:
          MASTODON_INSTANCE: "mastodon.social"
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python3 scripts/fetch_mastodon.py

      - name: Copier les données vers le site
        run: |
          mkdir -p site/data/reddit site/data/mastodon
          cp data/reddit/latest.json site/data/reddit/latest.json
          cp data/mastodon/latest.json site/data/mastodon/latest.json

      - name: Commit et push si changement
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/reddit data/mastodon site/data/reddit site/data/mastodon
          git diff --cached --quiet || git commit -m "Mise à jour automatique réseaux sociaux"
          git push

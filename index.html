<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OSINT - Zone Sud</title>
    <!-- Leaflet CSS pour la carte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f6f8; color: #333; }
        #sidebar { width: 300px; background: #fff; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #map { flex: 2; width: 100%; min-height: 300px; }
        #feed { flex: 1; background: #fff; padding: 20px; overflow-y: auto; border-top: 2px solid #e0e0e0; }
        h2 { margin-top: 0; color: #2c3e50; font-size: 1.2rem; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h3 { font-size: 1rem; color: #555; margin: 10px 0 5px; }
        select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: #fff; }
        select:disabled { background: #f0f0f0; color: #999; }
        .alert-card { background: #f8f9fa; border-left: 4px solid #3498db; padding: 15px; margin-bottom: 10px; border-radius: 4px; transition: transform 0.2s; }
        .alert-card:hover { transform: translateX(5px); background: #eef2f5; }
        .alert-card h4 { margin: 0 0 5px 0; font-size: 0.95rem; line-height: 1.4; }
        .alert-card a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .alert-card a:hover { text-decoration: underline; }
        .meta { font-size: 0.8rem; color: #666; margin-top: 8px; display: flex; justify-content: space-between; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; background: #e0e0e0; color: #333; font-weight: bold; }
        .badge.theme { background: #3498db; color: #fff; }
        #count { text-align: center; font-weight: bold; color: #555; margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>🔍 Filtres OSINT</h2>
    
    <h3>Région</h3>
    <select id="filter-region"><option value="all">Toutes les régions</option></select>
    
    <h3>Département</h3>
    <select id="filter-dept" disabled><option value="all">Tous les départements</option></select>
    
    <h3>Ville</h3>
    <select id="filter-city" disabled><option value="all">Toutes les villes</option></select>
    
    <h3>Thématique</h3>
    <select id="filter-theme">
        <option value="all">Toutes les thématiques</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Blocage occupation">Blocage / Occupation</option>
        <option value="Manifestation">Manifestation</option>
        <option value="Projet Amenagement Conteste">Projet Contesté</option>
        <option value="Criminalite organisee">Criminalité Organisée</option>
        <option value="Cybercriminalite">Cybercriminalité</option>
        <option value="Drones">Drones</option>
    </select>

    <div id="count">0 alerte(s)</div>
</div>

<div id="main">
    <div id="map"></div>
    <div id="feed"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Géographie intégrée pour garantir le fonctionnement des filtres en cascade
    const GEO_DATA = {
        "OCCITANIE": {
            "09": ["Foix", "Pamiers", "Saint-Girons"], "11": ["Carcassonne", "Narbonne", "Limoux"],
            "12": ["Rodez", "Millau"], "30": ["Nîmes", "Alès", "Bagnols-sur-Cèze"],
            "31": ["Toulouse", "Blagnac", "Colomiers", "Muret"], "32": ["Auch"],
            "34": ["Montpellier", "Béziers", "Sète", "Agde"], "46": ["Cahors", "Figeac"],
            "48": ["Mende"], "65": ["Tarbes", "Lourdes"], "66": ["Perpignan"],
            "81": ["Albi", "Castres"], "82": ["Montauban"]
        },
        "PACA": {
            "04": ["Digne-les-Bains", "Manosque"], "05": ["Gap", "Briançon"],
            "06": ["Nice", "Cannes", "Antibes", "Grasse"], "13": ["Marseille", "Aix-en-Provence", "Arles"],
            "83": ["Toulon", "La Seyne-sur-Mer", "Hyères", "Fréjus"], "84": ["Avignon", "Orange", "Carpentras"]
        },
        "CORSE": {
            "2A": ["Ajaccio", "Porto-Vecchio"], "2B": ["Bastia", "Corte"]
        }
    };

    let allData = [];
    let map = L.map('map').setView([43.6, 3.8], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    let markersLayer = L.layerGroup().addTo(map);

    const selRegion = document.getElementById('filter-region');
    const selDept = document.getElementById('filter-dept');
    const selCity = document.getElementById('filter-city');
    const selTheme = document.getElementById('filter-theme');

    // Peupler les régions
    Object.keys(GEO_DATA).forEach(r => selRegion.add(new Option(r, r)));

    // Filtre en cascade : Région -> Département
    selRegion.addEventListener('change', () => {
        selDept.innerHTML = '<option value="all">Tous les départements</option>';
        selCity.innerHTML = '<option value="all">Toutes les villes</option>';
        selCity.disabled = true;
        
        if (selRegion.value !== 'all') {
            selDept.disabled = false;
            Object.keys(GEO_DATA[selRegion.value]).forEach(d => {
                selDept.add(new Option(d, d));
            });
        } else {
            selDept.disabled = true;
        }
        applyFilters();
    });

    // Filtre en cascade : Département -> Ville
    selDept.addEventListener('change', () => {
        selCity.innerHTML = '<option value="all">Toutes les villes</option>';
        if (selRegion.value !== 'all' && selDept.value !== 'all') {
            selCity.disabled = false;
            GEO_DATA[selRegion.value][selDept.value].forEach(c => selCity.add(new Option(c, c)));
        } else {
            selCity.disabled = true;
        }
        applyFilters();
    });

    selCity.addEventListener('change', applyFilters);
    selTheme.addEventListener('change', applyFilters);

    // 2. Fonction de nettoyage du JSON (supprime les espaces parasites dans les clés)
    function cleanKeys(obj) {
        if (Array.isArray(obj)) return obj.map(cleanKeys);
        if (obj !== null && typeof obj === 'object') {
            return Object.keys(obj).reduce((acc, key) => {
                const cleanKey = key.trim();
                acc[cleanKey] = (typeof obj[key] === 'object') ? cleanKeys(obj[key]) : (typeof obj[key] === 'string' ? obj[key].trim() : obj[key]);
                return acc;
            }, {});
        }
        return obj;
    }

    // 3. Chargement des données
    async function loadData() {
        try {
            const response = await fetch('data_feed.json?t=' + new Date().getTime());
            const rawData = await response.json();
            allData = cleanKeys(rawData); // Nettoyage à la volée
            applyFilters();
        } catch (e) {
            console.error("Erreur chargement data_feed.json", e);
            document.getElementById('feed').innerHTML = "<p style='color:red;'>Erreur de chargement des données. Vérifiez que data_feed.json existe.</p>";
        }
    }

    // 4. Application des filtres et affichage
    function applyFilters() {
        const r = selRegion.value;
        const d = selDept.value;
        const c = selCity.value;
        const t = selTheme.value;

        const filtered = allData.filter(evt => {
            const loc = evt.location || {};
            const matchR = (r === 'all' || loc.region === r);
            const matchD = (d === 'all' || loc.department === d);
            const matchC = (c === 'all' || loc.city === c);
            const matchT = (t === 'all' || evt.theme === t);
            return matchR && matchD && matchC && matchT;
        });

        renderFeed(filtered);
        renderMap(filtered);
        document.getElementById('count').innerText = `${filtered.length} alerte(s)`;
    }

    function renderFeed(data) {
        const feed = document.getElementById('feed');
        if (data.length === 0) {
            feed.innerHTML = "<p>Aucune alerte ne correspond aux filtres sélectionnés.</p>";
            return;
        }
        
        feed.innerHTML = data.map(evt => `
            <div class="alert-card">
                <h4><a href="${evt.url}" target="_blank">${evt.title}</a></h4>
                <div class="meta">
                    <span class="badge theme">${evt.theme || 'Non classé'}</span>
                    <span>${evt.location ? evt.location.city + ' (' + evt.location.department + ')' : 'Localisation inconnue'}</span>
                </div>
                <div class="meta" style="margin-top:5px; font-style:italic;">
                    <span>Source: ${evt.source_name || 'Inconnue'}</span>
                    <span>${new Date(evt.timestamp).toLocaleDateString('fr-FR')}</span>
                </div>
            </div>
        `).join('');
    }

    function renderMap(data) {
        markersLayer.clearLayers();
        data.forEach(evt => {
            if (evt.location && evt.location.lat && evt.location.lng) {
                const marker = L.marker([evt.location.lat, evt.location.lng]);
                marker.bindPopup(`<b>${evt.title}</b><br><a href="${evt.url}" target="_blank">Lire l'article</a>`);
                markersLayer.addLayer(marker);
            }
        });
    }

    // Initialisation
    loadData();
</script>
</body>
</html>

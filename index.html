<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OSINT - Zone Sud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0d1117; 
            color: #e6edf3; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        
        /* HEADER COMPACT */
        header {
            background: #161b22;
            border-bottom: 2px solid #00d4ff;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.15);
            flex-shrink: 0;
        }
        .header-top, .osint-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .header-top h1 {
            color: #00d4ff;
            font-size: 0.95rem;
            margin-right: 5px;
            white-space: nowrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-group label {
            font-size: 0.65rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: bold;
        }
        select, input[type="text"] {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.75rem;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00d4ff;
        }
        #count-badge {
            background: #00d4ff;
            color: #0d1117;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.7rem;
            margin-left: auto;
        }

        /* BARRE INVESTIGATION OSINT */
        .osint-bar {
            background: #0d1117;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px dashed #30363d;
        }
        .osint-bar label {
            color: #00d4ff;
            font-size: 0.68rem;
            font-weight: bold;
        }
        .btn-osint {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-osint:hover { background: #2ea043; }

        /* BLOC TOP 20 TENDANCES (4 COLONNES DE 5 ÉLÉMENTS) */
        .trends-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .trends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .trends-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, auto);
            grid-auto-flow: column;
            gap: 3px 10px;
            max-height: 110px;
            overflow-y: auto;
        }
        .trend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.67rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .trend-item:hover {
            background: #21262d;
        }
        .trend-rank {
            color: #8b949e;
            font-weight: bold;
            font-size: 0.62rem;
            width: 16px;
            text-align: right;
            flex-shrink: 0;
        }
        .trend-term {
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .trend-bar-wrapper {
            width: 35px;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .trend-bar-fill {
            height: 100%;
            background: #00d4ff;
            border-radius: 2px;
        }
        .trend-item:hover .trend-bar-fill {
            background: #ff9900;
        }

        /* ESPACE PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 8px 12px;
            gap: 8px;
        }
        .columns-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1;
            min-height: 0;
        }
        .region-column {
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .column-header {
            background: #21262d;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00d4ff;
        }
        .column-header .col-count {
            background: #30363d;
            color: #e6edf3;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 0.68rem;
        }
        .column-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .other-zone {
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            max-height: 200px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .alert-card {
            background: #0d1117;
            border-left: 3px solid #00d4ff;
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 4px;
        }
        .alert-card.orange { border-left-color: #ff9900; }
        .alert-card.red { border-left-color: #ff4444; }
        .alert-card.blue { border-left-color: #00d4ff; }
        
        .alert-card h4 { font-size: 0.78rem; line-height: 1.25; margin-bottom: 4px; }
        .alert-card h4 a { color: #e6edf3; text-decoration: none; }
        .alert-card h4 a:hover { color: #00d4ff; text-decoration: underline; }
        
        .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #8b949e; }
        .badge { padding: 1px 5px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; background: #00d4ff; color: #0d1117; }
        .badge.orange { background: #ff9900; color: #0d1117; }
        .badge.red { background: #ff4444; color: #fff; }
        .badge.blue { background: #00d4ff; color: #0d1117; }

        .empty-state { text-align: center; color: #8b949e; padding: 10px; font-style: italic; font-size: 0.75rem; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>🛰️ OSINT SUD</h1>
        
        <div class="filter-group">
            <label>Source</label>
            <select id="filter-source">
                <option value="all">Toutes</option>
                <option value="orange">🟠 Presse Locale</option>
                <option value="red">🔴 Réseaux Sociaux</option>
                <option value="blue">🔵 Google News</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Thème</label>
            <select id="filter-theme">
                <option value="all">Tous les thèmes</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Animaliste">Animaliste</option>
                <option value="Apologie">Apologie</option>
                <option value="Armes">Armes</option>
                <option value="Blocage grève">Blocage grève</option>
                <option value="Chasse">Chasse</option>
                <option value="Criminalité organisée">Criminalité organisée</option>
                <option value="Culte">Culte</option>
                <option value="Cybercriminalité">Cybercriminalité</option>
                <option value="Délinquance criminalité">Délinquance criminalité</option>
                <option value="Dérives Sectaires">Dérives Sectaires</option>
                <option value="Drones">Drones</option>
                <option value="Ecologie">Ecologie</option>
                <option value="Education nationale">Education nationale</option>
                <option value="Elections 2027">Elections 2027</option>
                <option value="Ferroviaire">Ferroviaire</option>
                <option value="Festivité Evènements voie publique">Festivité Evènements voie publique</option>
                <option value="Free Rave Teknival">Free Rave Teknival</option>
                <option value="Immigration">Immigration</option>
                <option value="Intrusion">Intrusion</option>
                <option value="JOPH 2030">JOPH 2030</option>
                <option value="Manifestation">Manifestation</option>
                <option value="Nucléaire">Nucléaire</option>
                <option value="Pêche">Pêche</option>
                <option value="Prévention de la délinquance">Prévention de la délinquance</option>
                <option value="Projet aménagement contesté (PAC)">Projet aménagement contesté (PAC)</option>
                <option value="Prosélytisme">Prosélytisme</option>
                <option value="Radicalisation">Radicalisation</option>
                <option value="Santé">Santé</option>
                <option value="Séparatisme">Séparatisme</option>
                <option value="Survivalisme">Survivalisme</option>
                <option value="Terrorisme">Terrorisme</option>
                <option value="Transport">Transport</option>
                <option value="Ultra droite">Ultra droite</option>
                <option value="Ultra gauche">Ultra gauche</option>
                <option value="Visite officielle">Visite officielle</option>
            </select>
        </div>
        
        <div class="filter-group" style="flex:1; min-width:140px;">
            <input type="text" id="search-box" placeholder="Mots-clés (titre, ville, thème...)..." style="width:100%;">
        </div>
        
        <div id="count-badge">0 alerte(s)</div>
    </div>

    <!-- RECHERCHE OSINT -->
    <div class="osint-bar">
        <label>🔍 DORK :</label>
        <input type="text" id="osint-query" placeholder="Saisir ou cliquer sur une tendance..." style="flex:1; min-width:140px;">
        
        <select id="osint-platform">
            <option value="all">🌐 Tous Réseaux</option>
            <option value="x">🐦 X (Twitter)</option>
            <option value="fb">📘 Facebook</option>
            <option value="mastodon">🐘 Mastodon</option>
            <option value="telegram">✈️ Telegram</option>
        </select>

        <button class="btn-osint" onclick="runOsintSearch()">Rechercher</button>
    </div>

    <!-- TOP 20 TENDANCES -->
    <div class="trends-container">
        <div class="trends-header">
            <span>🔥 TOP 20 TENDANCES WEB (GOOGLE TRENDS)</span>
            <span style="color:#8b949e; font-size:0.6rem;">💡 Cliquez sur un sujet pour lancer la recherche Dork</span>
        </div>
        <div id="trends-grid" class="trends-grid"></div>
    </div>
</header>

<main>
    <div class="columns-container">
        <div class="region-column">
            <div class="column-header">
                <span>📍 Occitanie</span>
                <span class="col-count" id="count-occitanie">0</span>
            </div>
            <div class="column-body" id="feed-occitanie"></div>
        </div>

        <div class="region-column">
            <div class="column-header">
                <span>📍 PACA</span>
                <span class="col-count" id="count-paca">0</span>
            </div>
            <div class="column-body" id="feed-paca"></div>
        </div>

        <div class="region-column">
            <div class="column-header">
                <span>📍 Corse</span>
                <span class="col-count" id="count-corse">0</span>
            </div>
            <div class="column-body" id="feed-corse"></div>
        </div>
    </div>

    <div class="other-zone" id="container-other" style="display:none;">
        <div class="column-header">
            <span>🌐 Hors Zone / Non spécifié</span>
            <span class="col-count" id="count-other">0</span>
        </div>
        <div class="column-body" id="feed-other"></div>
    </div>
</main>

<script>
    let allData = [];

    const selSource = document.getElementById('filter-source');
    const selTheme = document.getElementById('filter-theme');
    const searchBox = document.getElementById('search-box');

    selTheme.addEventListener('change', applyFilters);
    selSource.addEventListener('change', applyFilters);
    searchBox.addEventListener('input', applyFilters);

    function runOsintSearch(customQuery = null) {
        const query = customQuery || document.getElementById('osint-query').value.trim();
        const platform = document.getElementById('osint-platform').value;

        if (!query) {
            alert("Veuillez saisir ou cliquer sur un terme.");
            return;
        }

        let dork = "";
        switch (platform) {
            case 'x': dork = `site:x.com "${query}"`; break;
            case 'fb': dork = `site:facebook.com "${query}"`; break;
            case 'mastodon': dork = `(site:mastodon.social OR site:mamot.fr) "${query}"`; break;
            case 'telegram': dork = `site:t.me "${query}"`; break;
            case 'all':
            default:
                dork = `(site:x.com OR site:facebook.com OR site:t.me OR site:mastodon.social) "${query}"`;
                break;
        }

        window.open(`https://www.google.com/search?q=${encodeURIComponent(dork)}`, '_blank');
    }

    async function loadTrendsChart() {
        try {
            const response = await fetch('trending.json?t=' + new Date().getTime());
            let trends = [];
            
            if (response.ok) {
                trends = await response.json();
            }

            if (!trends || trends.length < 20) {
                const defaultTrends = [
                    { term: "agriculture", score: 90 },
                    { term: "manifestation", score: 85 },
                    { term: "sécurité", score: 80 },
                    { term: "écologie", score: 75 },
                    { term: "délinquance", score: 70 },
                    { term: "immigration", score: 65 },
                    { term: "réseaux sociaux", score: 60 },
                    { term: "transports", score: 55 },
                    { term: "narcotrafic", score: 50 },
                    { term: "énergie", score: 45 },
                    { term: "climat", score: 40 },
                    { term: "santé", score: 35 },
                    { term: "économie", score: 30 },
                    { term: "sécheresse", score: 25 },
                    { term: "inondations", score: 20 },
                    { term: "cyberattaque", score: 18 },
                    { term: "blocage grève", score: 15 },
                    { term: "législation", score: 12 },
                    { term: "zone sud", score: 10 },
                    { term: "osint france", score: 10 }
                ];

                const existingTerms = new Set((trends || []).map(t => (t.term || '').toLowerCase()));
                for (const def of defaultTrends) {
                    if (trends.length >= 20) break;
                    if (!existingTerms.has(def.term.toLowerCase())) {
                        trends.push(def);
                    }
                }
            }

            const gridContainer = document.getElementById('trends-grid');
            if (!gridContainer) return;

            gridContainer.innerHTML = trends.slice(0, 20).map((t, index) => {
                const rank = index + 1;
                const scorePercent = Math.max(t.score || 10, 10);
                const safeTerm = (t.term || '').replace(/'/g, "\\'");
                return `
                    <div class="trend-item" onclick="selectTrend('${safeTerm}')">
                        <span class="trend-rank">${rank}.</span>
                        <span class="trend-term" title="${t.term}">${t.term}</span>
                        <div class="trend-bar-wrapper">
                            <div class="trend-bar-fill" style="width: ${scorePercent}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (e) {
            console.error("Erreur de chargement du fichier trending.json", e);
        }
    }

    function selectTrend(term) {
        document.getElementById('osint-query').value = term;
        runOsintSearch(term);
    }

    function cleanKeys(obj) {
        if (Array.isArray(obj)) return obj.map(cleanKeys);
        if (obj !== null && typeof obj === 'object') {
            return Object.keys(obj).reduce((acc, key) => {
                const cleanKey = key.trim();
                acc[cleanKey] = (typeof obj[key] === 'object') ? cleanKeys(obj[key]) : (typeof obj[key] === 'string' ? obj[key].trim() : obj[key]);
                return acc;
            }, {});
        }
        return obj;
    }

    async function loadData() {
        try {
            const response = await fetch('data_feed.json?t=' + new Date().getTime());
            const rawData = await response.json();
            allData = cleanKeys(rawData);
            applyFilters();
        } catch (e) {
            console.error("Erreur de chargement du fichier data_feed.json", e);
            document.getElementById('feed-occitanie').innerHTML = "<p class='empty-state' style='color:#ff5555;'>Erreur : data_feed.json introuvable.</p>";
        }
    }

    function normalizeRegion(regionName, sourceName) {
        const reg = (regionName || '').toLowerCase();
        const src = (sourceName || '').toLowerCase();

        if (reg.includes('occitanie')) return 'OCCITANIE';
        if (reg.includes('paca') || reg.includes('provence')) return 'PACA';
        if (reg.includes('corse')) return 'CORSE';

        if (src.includes('dépêche') || src.includes('midi libre') || src.includes('indépendant') || src.includes('journal toulousain') || src.includes('france 3 occitanie')) {
            return 'OCCITANIE';
        }
        if (src.includes('provence') || src.includes('nice-matin') || src.includes('var-matin') || src.includes('marseillaise') || src.includes('france 3 paca')) {
            return 'PACA';
        }
        if (src.includes('corse-matin') || src.includes('france 3 corse')) {
            return 'CORSE';
        }

        return 'OTHER';
    }

    function applyFilters() {
        const src = selSource.value;
        const t = selTheme.value;
        const search = searchBox.value.toLowerCase().trim();

        const filtered = allData.filter(evt => {
            // Filtre par source (orange, red, blue ou all)
            const matchSrc = (src === 'all' || evt.source_category === src);
            
            // Filtre par thème exact
            const eventTheme = (evt.theme || '').toLowerCase().trim();
            const selectedTheme = t.toLowerCase().trim();
            const matchT = (t === 'all' || eventTheme === selectedTheme);

            // Filtre par mots-clés dans la barre de recherche textuelle
            let matchSearch = true;
            if (search) {
                const searchText = `${evt.title || ''} ${evt.source_name || ''} ${evt.theme || ''} ${evt.region || ''} ${evt.description || evt.summary || ''}`.toLowerCase();
                matchSearch = searchText.includes(search);
            }

            return matchSrc && matchT && matchSearch;
        });

        const grouped = { OCCITANIE: [], PACA: [], CORSE: [], OTHER: [] };

        filtered.forEach(evt => {
            const regKey = normalizeRegion(evt.region, evt.source_name);
            grouped[regKey].push(evt);
        });

        renderColumn('feed-occitanie', 'count-occitanie', grouped.OCCITANIE);
        renderColumn('feed-paca', 'count-paca', grouped.PACA);
        renderColumn('feed-corse', 'count-corse', grouped.CORSE);

        const otherContainer = document.getElementById('container-other');
        if (grouped.OTHER.length > 0) {
            otherContainer.style.display = 'flex';
            renderColumn('feed-other', 'count-other', grouped.OTHER);
        } else {
            otherContainer.style.display = 'none';
        }

        document.getElementById('count-badge').innerText = `${filtered.length} alerte(s)`;
    }

    function renderColumn(feedId, countId, data) {
        const feed = document.getElementById(feedId);
        document.getElementById(countId).innerText = data.length;

        if (data.length === 0) {
            feed.innerHTML = "<div class='empty-state'>Aucune alerte</div>";
            return;
        }
        
        feed.innerHTML = data.map(evt => {
            const dateStr = evt.timestamp ? new Date(evt.timestamp).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : '';
            const sourceCat = evt.source_category || 'blue';
            
            return `
            <div class="alert-card ${sourceCat}">
                <h4><a href="${evt.url || '#'}" target="_blank">${evt.title}</a></h4>
                <div class="meta">
                    <span class="badge ${sourceCat}">${evt.theme || 'Alerte'}</span>
                    <span>${dateStr}</span>
                </div>
            </div>
        `}).join('');
    }

    loadData();
    loadTrendsChart();
</script>
</body>
</html>

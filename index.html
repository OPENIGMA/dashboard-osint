<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OSINT</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #controls { padding: 10px; background: #1a1a1a; color: white; display: flex; gap: 10px; align-items: center; }
        #map { height: calc(100vh - 50px); width: 100%; }
        select { padding: 8px; font-weight: bold; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="controls">
        <label for="region-filter"><strong>RÉGION :</strong></label>
        <select id="region-filter" onchange="filterData()">
            <option value="ALL">TOUTES LES RÉGIONS</option>
            <option value="OCCITANIE">OCCITANIE</option>
            <option value="PACA">PACA</option>
            <option value="CORSE">CORSE</option>
        </select>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Définition des différentes couches de carte (Multi-couches 100% gratuites)
        const layerOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const layerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap © CARTO'
        });

        const layerSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles © Esri'
        });

        // 2. Initialisation de la carte sur le fond Sombre par défaut
        const map = L.map('map', {
            center: [43.6047, 3.8767],
            zoom: 7,
            layers: [layerDark]
        });

        // 3. Ajout du contrôle multi-couches en haut à droite
        const baseMaps = {
            "Fond Sombre (OSINT)": layerDark,
            "Vue Satellite": layerSatellite,
            "Plan Standard": layerOSM
        };
        L.control.layers(baseMaps).addTo(map);

        let allEvents = [];
        let markersGroup = L.layerGroup().addTo(map);

        // 4. Chargement des données JSON avec anti-cache
        function loadData() {
            fetch('data_feed.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("Erreur de chargement");
                    return response.json();
                })
                .then(data => {
                    allEvents = data;
                    renderMarkers(allEvents);
                })
                .catch(err => console.error("Erreur :", err));
        }

        // 5. Affichage des repères sur la carte
        function renderMarkers(events) {
            markersGroup.clearLayers();

            events.forEach(evt => {
                if (evt.location && evt.location.lat && evt.location.lng) {
                    const marker = L.marker([evt.location.lat, evt.location.lng]);
                    const dateFormatted = new Date(evt.timestamp).toLocaleString('fr-FR');
                    
                    const popupContent = `
                        <div style="font-family: Arial, sans-serif;">
                            <h4 style="margin: 0 0 5px 0;">${evt.title}</h4>
                            <p style="margin: 0 0 5px 0; font-size: 12px; color: #555;">
                                <strong>Thème:</strong> ${evt.theme}<br>
                                <strong>Source:</strong> ${evt.source_name}<br>
                                <strong>Date:</strong> ${dateFormatted}
                            </p>
                            <a href="${evt.url}" target="_blank" style="color: #0066cc; font-weight: bold;">Consulter l'article</a>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    markersGroup.addLayer(marker);
                }
            });
        }

        // 6. Filtrage par région
        function filterData() {
            const selectedRegion = document.getElementById('region-filter').value;
            
            if (selectedRegion === 'ALL') {
                renderMarkers(allEvents);
            } else {
                const filtered = allEvents.filter(evt => evt.location && evt.location.region === selectedRegion);
                renderMarkers(filtered);
            }
        }

        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OSINT - Zone Sud</title>
    <!-- Inclusion de Chart.js pour l'histogramme des tendances -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0d1117; 
            color: #e6edf3; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        
        /* HEADER COMPACT - Filtres, Dork et Tendances */
        header {
            background: #161b22;
            border-bottom: 2px solid #00d4ff;
            padding: 8px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.15);
            flex-shrink: 0;
        }
        .header-top, .osint-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .header-top h1 {
            color: #00d4ff;
            font-size: 1rem;
            margin-right: 10px;
            white-space: nowrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .filter-group label {
            font-size: 0.65rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: bold;
        }
        select, input[type="text"] {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            outline: none;
            transition: border 0.2s;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00d4ff;
        }
        #count-badge {
            background: #00d4ff;
            color: #0d1117;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
            margin-left: auto;
        }

        /* Barre OSINT compacte */
        .osint-bar {
            background: #0d1117;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px dashed #30363d;
        }
        .osint-bar label {
            color: #00d4ff;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .btn-osint {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-osint:hover { background: #2ea043; }

        /* Module Top 10 Tendances REDIMENSIONNÉ */
        .trends-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .trends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .chart-wrapper {
            position: relative;
            height: 80px; /* Taille fortement réduite pour libérer l'espace */
            width: 100%;
        }

        /* MAIN - Layout optimisé pour la lecture des 3 colonnes */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 15px;
            gap: 10px;
        }
        .columns-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        .region-column {
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .column-header {
            background: #21262d;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00d4ff;
        }
        .column-header .col-count {
            background: #30363d;
            color: #e6edf3;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 0.7rem;
        }
        .column-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .other-zone {
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            max-height: 150px;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbars */
        .column-body::-webkit-scrollbar { width: 5px; }
        .column-body::-webkit-scrollbar-track { background: #0d1117; }
        .column-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        .column-body::-webkit-scrollbar-thumb:hover { background: #00d4ff; }

        /* Cartes d'alertes */
        .alert-card {
            background: #0d1117;
            border-left: 3px solid #00d4ff;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 4px;
        }
        .alert-card.orange { border-left-color: #ff9900; }
        .alert-card.red { border-left-color: #ff4444; }
        .alert-card.blue { border-left-color: #00d4ff; }
        
        .alert-card h4 { font-size: 0.8rem; line-height: 1.2; margin-bottom: 4px; }
        .alert-card h4 a { color: #e6edf3; text-decoration: none; }
        .alert-card h4 a:hover { color: #00d4ff; text-decoration: underline; }
        
        .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #8b949e; }
        .badge { padding: 1px 5px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; background: #00d4ff; color: #0d1117; }
        .badge.orange { background: #ff9900; color: #0d1117; }
        .badge.red { background: #ff4444; color: #fff; }
        .badge.blue { background: #00d4ff; color: #0d1117; }
        .badge.source { background: #30363d; color: #e6edf3; }

        .empty-state { text-align: center; color: #8b949e; padding: 15px; font-style: italic; font-size: 0.75rem; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>🛰️ OSINT SUD</h1>
        
        <div class="filter-group">
            <label>Source</label>
            <select id="filter-source">
                <option value="all">Toutes</option>
                <option value="orange">🟠 Presse Locale</option>
                <option value="red">🔴 Réseaux Sociaux</option>
                <option value="blue">🔵 Google News</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>Thème</label>
            <select id="filter-theme">
                <option value="all">Tous</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Armes">Armes</option>
                <option value="Chasse">Chasse</option>
                <option value="Délinquance criminalité">Délinquance criminalité</option>
                <option value="Ecologie">Ecologie</option>
                <option value="Free Rave Teknival">Free Rave Teknival</option>
                <option value="Immigration">Immigration</option>
                <option value="Manifestation">Manifestation</option>
                <option value="Reseaux Sociaux">Réseaux Sociaux</option>
                <option value="Ultra gauche">Ultra gauche</option>
                <option value="Ultra droite">Ultra droite</option>
            </select>
        </div>
        
        <div class="filter-group" style="flex:1; min-width:150px;">
            <input type="text" id="search-box" placeholder="Mots-clés cartes..." style="width:100%;">
        </div>
        
        <div id="count-badge">0 alerte(s)</div>
    </div>

    <!-- MODULE DE RECHERCHE OSINT RESEAUX -->
    <div class="osint-bar">
        <label>🔍 INVESTIGATION :</label>
        <input type="text" id="osint-query" placeholder="Terme à rechercher..." style="flex:1; min-width:150px;">
        
        <select id="osint-platform">
            <option value="all">🌐 Tous Réseaux</option>
            <option value="x">🐦 X (Twitter)</option>
            <option value="fb">📘 Facebook</option>
            <option value="mastodon">🐘 Mastodon</option>
            <option value="telegram">✈️ Telegram</option>
        </select>

        <button class="btn-osint" onclick="runOsintSearch()">Lancer le Dork</button>
    </div>

    <!-- MODULE TOP 10 TENDANCES COMPACT ET CLIQUABLE -->
    <div class="trends-container">
        <div class="trends-header">
            <span>🔥 TOP 10 TENDANCES (GOOGLE TRENDS + X)</span>
            <span style="color:#8b949e; font-size:0.65rem;">Cliquez sur une barre pour lancer la recherche</span>
        </div>
        <div class="chart-wrapper">
            <canvas id="trendsChart"></canvas>
        </div>
    </div>
</header>

<main>
    <div class="columns-container">
        <div class="region-column">
            <div class="column-header">
                <span>📍 Occitanie</span>
                <span class="col-count" id="count-occitanie">0</span>
            </div>
            <div class="column-body" id="feed-occitanie"></div>
        </div>

        <div class="region-column">
            <div class="column-header">
                <span>📍 PACA</span>
                <span class="col-count" id="count-paca">0</span>
            </div>
            <div class="column-body" id="feed-paca"></div>
        </div>

        <div class="region-column">
            <div class="column-header">
                <span>📍 Corse</span>
                <span class="col-count" id="count-corse">0</span>
            </div>
            <div class="column-body" id="feed-corse"></div>
        </div>
    </div>

    <div class="other-zone" id="container-other" style="display:none;">
        <div class="column-header">
            <span>🌐 Hors Zone / Non spécifié</span>
            <span class="col-count" id="count-other">0</span>
        </div>
        <div class="column-body" id="feed-other"></div>
    </div>
</main>

<script>
    let allData = [];
    let trendsChartInstance = null;

    const selSource = document.getElementById('filter-source');
    const selTheme = document.getElementById('filter-theme');
    const searchBox = document.getElementById('search-box');

    selTheme.addEventListener('change', applyFilters);
    selSource.addEventListener('change', applyFilters);
    searchBox.addEventListener('input', applyFilters);

    function runOsintSearch(customQuery = null) {
        const query = customQuery || document.getElementById('osint-query').value.trim();
        const platform = document.getElementById('osint-platform').value;

        if (!query) {
            alert("Veuillez saisir un terme de recherche.");
            return;
        }

        let dork = "";
        switch (platform) {
            case 'x': dork = `site:x.com "${query}"`; break;
            case 'fb': dork = `site:facebook.com "${query}"`; break;
            case 'mastodon': dork = `(site:mastodon.social OR site:mamot.fr) "${query}"`; break;
            case 'telegram': dork = `site:t.me "${query}"`; break;
            case 'all':
            default:
                dork = `(site:x.com OR site:facebook.com OR site:t.me OR site:mastodon.social) "${query}"`;
                break;
        }

        window.open(`https://www.google.com/search?q=${encodeURIComponent(dork)}`, '_blank');
    }

    async function loadTrendsChart() {
        try {
            const response = await fetch('trending.json?t=' + new Date().getTime());
            const trends = await response.json();

            if (!trends || trends.length === 0) return;

            const labels = trends.map(t => t.term);
            const dataScores = trends.map(t => t.score);
            const backgroundColors = trends.map(t => t.source === "X (Twitter)" ? '#ff4444' : '#00d4ff');

            const ctx = document.getElementById('trendsChart').getContext('2d');
            
            if (trendsChartInstance) {
                trendsChartInstance.destroy();
            }

            trendsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataScores,
                        backgroundColor: backgroundColors,
                        borderRadius: 2,
                        barThickness: 5
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => ` Source: ${trends[context.dataIndex].source}`
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            ticks: { color: '#e6edf3', font: { size: 9 } },
                            grid: { display: false }
                        }
                    },
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const term = labels[index];
                            document.getElementById('osint-query').value = term;
                            runOsintSearch(term);
                        }
                    }
                }
            });
        } catch (e) {
            console.error("Erreur chargement trending.json", e);
        }
    }

    function cleanKeys(obj) {
        if (Array.isArray(obj)) return obj.map(cleanKeys);
        if (obj !== null && typeof obj === 'object') {
            return Object.keys(obj).reduce((acc, key) => {
                const cleanKey = key.trim();
                acc[cleanKey] = (typeof obj[key] === 'object') ? cleanKeys(obj[key]) : (typeof obj[key] === 'string' ? obj[key].trim() : obj[key]);
                return acc;
            }, {});
        }
        return obj;
    }

    async function loadData() {
        try {
            const response = await fetch('data_feed.json?t=' + new Date().getTime());
            const rawData = await response.json();
            allData = cleanKeys(rawData);
            applyFilters();
        } catch (e) {
            console.error("Erreur chargement data_feed.json", e);
            document.getElementById('feed-occitanie').innerHTML = "<p class='empty-state' style='color:#ff5555;'>Erreur de chargement.</p>";
        }
    }

    function normalizeRegion(regionName, sourceName) {
        const reg = (regionName || '').toLowerCase();
        const src = (sourceName || '').toLowerCase();

        if (reg.includes('occitanie')) return 'OCCITANIE';
        if (reg.includes('paca') || reg.includes('provence')) return 'PACA';
        if (reg.includes('corse')) return 'CORSE';

        if (src.includes('dépêche') || src.includes('midi libre') || src.includes('indépendant') || src.includes('montagne') || src.includes('journal toulousain') || src.includes('gazette du midi') || src.includes('france 3 occitanie')) {
            return 'OCCITANIE';
        }
        if (src.includes('provence') || src.includes('nice-matin') || src.includes('var-matin') || src.includes('marseillaise') || src.includes('dauphiné') || src.includes('france 3 paca')) {
            return 'PACA';
        }
        if (src.includes('corse-matin') || src.includes('france 3 corse')) {
            return 'CORSE';
        }

        return 'OTHER';
    }

    function applyFilters() {
        const src = selSource.value;
        const t = selTheme.value;
        const search = searchBox.value.toLowerCase().trim();

        const filtered = allData.filter(evt => {
            const matchSrc = (src === 'all' || evt.source_category === src);
            const matchT = (t === 'all' || evt.theme === t);
            
            let matchSearch = true;
            if (search) {
                const searchText = `${evt.title} ${evt.source_name} ${evt.theme} ${evt.region || ''}`.toLowerCase();
                matchSearch = searchText.includes(search);
            }
            
            return matchSrc && matchT && matchSearch;
        });

        const grouped = { OCCITANIE: [], PACA: [], CORSE: [], OTHER: [] };

        filtered.forEach(evt => {
            const regKey = normalizeRegion(evt.region, evt.source_name);
            grouped[regKey].push(evt);
        });

        renderColumn('feed-occitanie', 'count-occitanie', grouped.OCCITANIE);
        renderColumn('feed-paca', 'count-paca', grouped.PACA);
        renderColumn('feed-corse', 'count-corse', grouped.CORSE);
        
        const otherContainer = document.getElementById('container-other');
        if (grouped.OTHER.length > 0) {
            otherContainer.style.display = 'flex';
            renderColumn('feed-other', 'count-other', grouped.OTHER);
        } else {
            otherContainer.style.display = 'none';
        }

        document.getElementById('count-badge').innerText = `${filtered.length} alerte(s)`;
    }

    function renderColumn(feedId, countId, data) {
        const feed = document.getElementById(feedId);
        document.getElementById(countId).innerText = data.length;

        if (data.length === 0) {
            feed.innerHTML = "<div class='empty-state'>Aucune alerte</div>";
            return;
        }
        
        feed.innerHTML = data.map(evt => {
            const dateStr = evt.timestamp ? new Date(evt.timestamp).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : 'Date inconnue';
            const sourceCat = evt.source_category || 'blue';
            const sourceText = evt.source_name || 'Inconnue';
            
            return `
            <div class="alert-card ${sourceCat}">
                <h4><a href="${evt.url}" target="_blank">${evt.title}</a></h4>
                <div class="meta">
                    <span class="badge ${sourceCat}">${evt.theme || 'Non classé'}</span>
                </div>
                <div class="meta" style="margin-top:4px;">
                    <span class="badge source">${sourceText}</span>
                    <span>${dateStr}</span>
                </div>
            </div>
        `}).join('');
    }

    loadData();
    loadTrendsChart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plateforme de Veille & OSINT - Zone Sud</title>
  
  <!-- Leaflet CSS (Carte) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.5;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Barre de filtres */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    /* Layout principal */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .panel {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .badge-count {
      background-color: var(--accent-color);
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Carte */
    #map {
      height: 500px;
      width: 100%;
      border-radius: 6px;
      z-index: 1;
    }

    /* Tableau */
    .table-container {
      overflow-x: auto;
      max-height: 500px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #0f172a;
      color: var(--text-muted);
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:hover {
      background-color: rgba(56, 189, 248, 0.05);
    }

    a.event-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
    }

    a.event-link:hover {
      text-decoration: underline;
    }

    .tag-theme {
      display: inline-block;
      padding: 2px 6px;
      background-color: #334155;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Plateforme OSINT & Veille Régionale</h1>
    <p class="subtitle">Suivi automatique en zone Occitanie, PACA et Corse</p>
  </header>

  <!-- Barre de filtrage -->
  <div class="filter-bar">
    <!-- Barre de recherche libre -->
    <div class="filter-group">
      <label for="free-search">Recherche libre :</label>
      <input 
        type="text" 
        id="free-search" 
        placeholder="Mots-clés (ex: A69, tracteurs, Béziers...)" 
        oninput="applyFilters()"
      />
    </div>

    <!-- Filtre Thématique -->
    <div class="filter-group">
      <label for="theme-select">Thématique :</label>
      <select id="theme-select" onchange="applyFilters()">
        <option value="">Toutes les thématiques</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Evenement voie publique">Événement voie publique</option>
        <option value="Manifestation">Manifestation</option>
        <option value="Greve">Grève</option>
        <option value="Blocage occupation">Blocage / Occupation</option>
        <option value="Projet Amenagement Conteste">Projet aménagement contesté</option>
        <option value="Delinquance criminalite">Délinquance & Criminalité</option>
        <option value="Criminalite organisee">Criminalité organisée</option>
        <option value="Armes">Armes</option>
        <option value="Cybercriminalité">Cybercriminalité</option>
        <option value="Drones">Drones</option>
        <option value="Radicalisation">Radicalisation</option>
        <option value="Ultra-droite">Ultra-droite</option>
        <option value="Ultra-gauche">Ultra-gauche</option>
        <option value="Ecologie">Écologie radicale</option>
        <option value="Visite Officielle">Visite Officielle</option>
        <option value="Transports">Transports</option>
      </select>
    </div>

    <!-- Filtre Région -->
    <div class="filter-group">
      <label for="region-select">Région :</label>
      <select id="region-select" onchange="applyFilters()">
        <option value="">Toutes les régions</option>
        <option value="OCC">Occitanie</option>
        <option value="PACA">PACA</option>
        <option value="COR">Corse</option>
      </select>
    </div>
  </div>

  <!-- Dashboard Principal -->
  <div class="dashboard-grid">
    <!-- Panneau Carte -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Cartographie des événements</span>
        <span class="badge-count" id="map-count">0</span>
      </div>
      <div id="map"></div>
    </div>

    <!-- Panneau Flux / Tableau -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Dernières alertes collectées</span>
        <span class="badge-count" id="table-count">0</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Thématique</th>
              <th>Titre & Source</th>
              <th>Ville</th>
            </tr>
          </thead>
          <tbody id="events-table-body">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted);">Chargement des données...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Leaflet JS (Carte) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let allEvents = [];
    let map;
    let markersLayer;

    // Initialisation de la carte (Centrée sur le Sud de la France)
    function initMap() {
      map = L.map('map').setView([43.5, 3.8], 7);
      
      // Fond de carte sombre (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    // Chargement des données JSON générées par collector.py
    async function loadData() {
      try {
        const response = await fetch('data_feed.json');
        if (!response.ok) throw new Error("Impossible de charger data_feed.json");
        allEvents = await response.json();
        applyFilters();
      } catch (error) {
        console.error("Erreur de chargement :", error);
        document.getElementById('events-table-body').innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--danger-color);">
              Aucune donnée disponible. Exécutez le script d'acquisition.
            </td>
          </tr>`;
      }
    }

    // Application dynamique des filtres (Recherche libre + Thématique + Région)
    function applyFilters() {
      const selectedTheme = document.getElementById('theme-select').value;
      const selectedRegion = document.getElementById('region-select').value;
      const searchQuery = document.getElementById('free-search').value.toLowerCase().trim();

      const filteredEvents = allEvents.filter(event => {
        const matchTheme = !selectedTheme || event.theme === selectedTheme;
        const matchRegion = !selectedRegion || event.location.region === selectedRegion;
        
        // Recherche multi-champs (titre + résumé + source + ville)
        const fullText = `${event.title} ${event.summary} ${event.source_name} ${event.location.city}`.toLowerCase();
        const matchSearch = !searchQuery || fullText.includes(searchQuery);

        return matchTheme && matchRegion && matchSearch;
      });

      renderTable(filteredEvents);
      renderMap(filteredEvents);
    }

    // Rendu du tableau des résultats
    function renderTable(events) {
      const tbody = document.getElementById('events-table-body');
      document.getElementById('table-count').innerText = events.length;

      if (events.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-muted);">
              Aucune alerte ne correspond à vos critères.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = events.map(event => {
        const dateStr = new Date(event.timestamp).toLocaleDateString('fr-FR', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        
        return `
          <tr>
            <td style="white-space: nowrap; color: var(--text-muted); font-size: 0.8rem;">${dateStr}</td>
            <td><span class="tag-theme">${event.theme}</span></td>
            <td>
              <a href="${event.url}" target="_blank" class="event-link">${event.title}</a>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Source: ${event.source_name}</div>
            </td>
            <td><strong>${event.location.city}</strong></td>
          </tr>
        `;
      }).join('');
    }

    // Rendu de la carte avec marqueurs
    function renderMap(events) {
      markersLayer.clearLayers();
      document.getElementById('map-count').innerText = events.length;

      events.forEach(event => {
        if (event.location && event.location.lat && event.location.lng) {
          const marker = L.circleMarker([event.location.lat, event.location.lng], {
            radius: 7,
            fillColor: '#38bdf8',
            color: '#0f172a',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
          });

          marker.bindPopup(`
            <div style="color: #0f172a; font-family: sans-serif;">
              <strong style="font-size: 0.85rem; color: #0284c7;">${event.theme}</strong><br/>
              <a href="${event.url}" target="_blank" style="font-weight: bold; color: #0f172a; text-decoration: none;">${event.title}</a><br/>
              <small style="color: #64748b;">${event.location.city} — ${event.source_name}</small>
            </div>
          `);

          markersLayer.addLayer(marker);
        }
      });
    }

    // Démarrage au chargement de la page
    window.onload = () => {
      initMap();
      loadData();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veille OSINT — Zone Sud</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Style personnalisé pour les marqueurs luminescents */
    .glow-marker {
      background-color: #00f0ff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #00f0ff, 0 0 20px #00f0ff;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden">

  <!-- Header & Filtres -->
  <header class="bg-slate-900 border-b border-cyan-500/30 p-4 shadow-lg z-10">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
        <h1 class="text-xl font-bold tracking-wider text-cyan-400 uppercase">Veille OSINT — Zone Sud</h1>
      </div>
      
      <!-- Zone des filtres -->
      <div class="flex flex-wrap gap-3 text-sm">
        <!-- Thématique -->
        <select id="filter-theme" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 focus:border-cyan-400 outline-none text-slate-200">
          <option value="all">Toutes les thématiques</option>
        </select>

        <!-- Période -->
        <select id="filter-period" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 focus:border-cyan-400 outline-none text-slate-200">
          <option value="24h">Dernières 24h</option>
          <option value="7d" selected>7 derniers jours</option>
          <option value="30d">30 derniers jours</option>
          <option value="all">Historique complet</option>
        </select>

        <!-- Région -->
        <select id="filter-region" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 focus:border-cyan-400 outline-none text-slate-200">
          <option value="all">Toute la Zone Sud</option>
        </select>

        <!-- Département -->
        <select id="filter-dept" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 focus:border-cyan-400 outline-none text-slate-200" disabled>
          <option value="all">Tous les départements</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content (Split View) -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- Carte (Gauche) -->
    <div id="map" class="w-full md:w-2/3 h-1/2 md:h-full bg-slate-900 z-0"></div>

    <!-- Liste des Résultats (Droite) -->
    <section class="w-full md:w-1/3 h-1/2 md:h-full bg-slate-900/80 border-l border-slate-800 flex flex-col">
      <div class="p-3 border-b border-slate-800 bg-slate-900/90 flex justify-between items-center">
        <h2 class="font-semibold text-slate-300">Résultats en direct</h2>
        <span id="results-count" class="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">0 alerte</span>
      </div>
      
      <div id="results-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Les cartes d'alertes seront injectées ici -->
      </div>
    </section>

  </main>

  <!-- Script d'interaction -->
  <script>
    let map, markersLayer;
    let taxonomyData = {};
    let feedData = [];

    // Initialisation de la carte Leaflet
    function initMap() {
      // Centrer sur la Zone Sud (Toulouse/Marseille/Corse)
      map = L.map('map').setView([43.5, 5.0], 7);

      // Fond de carte sombre (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
    }

    // Chargement de la taxonomie JSON pour remplir les filtres
    async function loadTaxonomy() {
      try {
        const response = await fetch('taxonomy.json');
        taxonomyData = await response.json();
        
        // Remplir le filtre Thématiques
        const themeSelect = document.getElementById('filter-theme');
        taxonomyData.themes.forEach(group => {
          const optgroup = document.createElement('optgroup');
          optgroup.label = group.label;
          group.subthemes.forEach(sub => {
            const opt = document.createElement('option');
            opt.value = sub;
            opt.textContent = sub;
            optgroup.appendChild(opt);
          });
          themeSelect.appendChild(optgroup);
        });

        // Remplir le filtre Régions
        const regionSelect = document.getElementById('filter-region');
        taxonomyData.geography.regions.forEach(reg => {
          const opt = document.createElement('option');
          opt.value = reg.code;
          opt.textContent = reg.name;
          regionSelect.appendChild(opt);
        });

      } catch (err) {
        console.error("Erreur lors du chargement de taxonomy.json :", err);
      }
    }

    // Gestion dynamique de la sélection Région -> Département
    document.getElementById('filter-region').addEventListener('change', (e) => {
      const deptSelect = document.getElementById('filter-dept');
      deptSelect.innerHTML = '<option value="all">Tous les départements</option>';
      
      const selectedRegionCode = e.target.value;
      if (selectedRegionCode === 'all') {
        deptSelect.disabled = true;
        return;
      }

      const region = taxonomyData.geography.regions.find(r => r.code === selectedRegionCode);
      if (region) {
        region.departments.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.code;
          opt.textContent = `${d.code} - ${d.name}`;
          deptSelect.appendChild(opt);
        });
        deptSelect.disabled = false;
      }
    });

    // Chargement initial au démarrage
    window.addEventListener('DOMContentLoaded', async () => {
      initMap();
      await loadTaxonomy();
    });
  </script>
</body>
</html>
